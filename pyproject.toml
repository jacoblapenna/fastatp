[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastatp"
version = "0.1.0"
description = "AT Protocol identity and signed records for agents, workloads, and IoT — transport-agnostic."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacob Lapenna" }]
requires-python = ">=3.10"
keywords = [
    "atproto",
    "at-protocol",
    "did",
    "did-web",
    "did-key",
    "signed-records",
    "identity",
    "lexicon",
    "merkle-search-tree",
    "dag-cbor",
    "agents",
    "iot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=1.7.0",
    "pydantic>=2.14.1",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "regex>=2026.9.29",
    "websockets>=16.1.1",
]

[project.urls]
Homepage = "https://github.com/jacoblapenna/fastatp"
Repository = "https://github.com/jacoblapenna/fastatp"
Philosophy = "https://github.com/jacoblapenna/fastatp/blob/main/PHILOSOPHY.md"
Issues = "https://github.com/jacoblapenna/fastatp/issues"
Changelog = "https://github.com/jacoblapenna/fastatp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# durable block storage uses the stdlib `sqlite3` (synchronous, matching the
# BlockStore protocol) — no dependency, so there is no "sqlite" extra
fastapi = ["fastapi>=0.162.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4.0",
    # cross-implementation differential codec check (tests/cross_sdk/): a small
    # Rust-backed wheel, no dependency conflict — kept in `dev` so a normal
    # dev install runs it instead of skipping.
    "libipld>=3.5.0",
]
# Cross-ecosystem interop test (tests/test_sensorthings_interop.py): an UNMODIFIED
# third-party package flattens a FastATP-exported CAR. It pulls in the MarshalX
# `atproto` SDK and its pins — the very SDK FastATP deliberately does NOT depend
# on — so it is isolated here, never in `dev`. Install it (or use a separate venv)
# only to run that one cross-ecosystem test; the test skips cleanly without it.
interop = ["atproto-sensorthings"]

[tool.hatch.build]
# the compiled browser peer bundle (built by scripts/build-wasm.sh) is
# VCS-ignored but must ship in BOTH the wheel and the sdist when present at
# build time, so plain `pip install` never needs a Rust toolchain
artifacts = ["fastatp/browser/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["fastatp"]

[tool.ruff]
line-length = 100
target-version = "py310"
# tests/vectors/ is the vendored CC-0 conformance corpus (see its
# PROVENANCE.md) — third-party files, not ours to lint or reformat
extend-exclude = ["tests/vectors/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary is not always clearer
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["reference/", "build/", "examples/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "regex"
ignore_missing_imports = true

# The codegen half of the schema bridge builds models and annotations
# dynamically; static typing of those constructions is not meaningful.
[[tool.mypy.overrides]]
module = "fastatp.lex.schema"
disable_error_code = [
    "arg-type",
    "assignment",
    "call-overload",
    "misc",
    "return-value",
    "union-attr",
    "unused-ignore",
    "valid-type",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:fastatp.*"]

[tool.coverage.run]
source = ["fastatp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
