[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastatp"
version = "0.3.1.dev0"
description = "Composable atproto (AT Protocol) signed records, authentication and authorization without OAuth or tokens, for agents, workloads, IoT, and people. Public or private via WireGuard-gated peers. An alternative to MCP and A2A."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacob Lapenna" }]
requires-python = ">=3.11"
keywords = [
    "atproto",
    "atprotocol",
    "at-protocol",
    "private-atproto",
    "did",
    "decentralized-identity",
    "signed-records",
    "authn",
    "authz",
    "declarative-authorization",
    "capability-based-security",
    "oauth-alternative",
    "zero-trust",
    "wireguard",
    "lexicon",
    "iot",
    "machine-to-machine",
    "mcp-alternative",
    "a2a-alternative",
    "agent-to-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=0.37",
    "pydantic>=2.0",
    "cryptography>=50",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "regex>=2024.4.16",
    "websockets>=12",
]

[project.urls]
Homepage = "https://fastatp.com"
Repository = "https://github.com/jacoblapenna/fastatp"
Philosophy = "https://github.com/jacoblapenna/fastatp/blob/main/PHILOSOPHY.md"
Issues = "https://github.com/jacoblapenna/fastatp/issues"
Changelog = "https://github.com/jacoblapenna/fastatp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# durable block storage uses the stdlib `sqlite3` (synchronous, matching the
# BlockStore protocol) — no dependency, so there is no "sqlite" extra
fastapi = ["fastapi>=0.100"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.17.3,<0.18",
    "mypy>=1.10",
    # cross-implementation differential codec check (tests/cross_sdk/): a small
    # Rust-backed wheel, no dependency conflict — kept in `dev` so a normal
    # dev install runs it instead of skipping.
    "libipld>=3.4",
    # the release job builds and checks the dist from the lockfile, never
    # from whatever is newest on PyPI that day (uv build --no-build-isolation)
    "hatchling",
    "twine",
    # renders the repo's markdown into fastatp.com (website/build.py); the
    # site's test builds it, so a broken link fails here, not after a merge
    "markdown-it-py>=3",
]
# Cross-ecosystem interop test (tests/test_sensorthings_interop.py): an UNMODIFIED
# third-party package flattens a FastATP-exported CAR. It pulls in the MarshalX
# `atproto` SDK and its pins — the very SDK FastATP deliberately does NOT depend
# on — so it is isolated here, never in `dev`. Install it (or use a separate venv)
# only to run that one cross-ecosystem test; the test skips cleanly without it.
interop = ["atproto-sensorthings"]

[tool.hatch.build]
# the compiled browser peer bundle (built by scripts/build-wasm.sh) is
# VCS-ignored but must ship in BOTH the wheel and the sdist when present at
# build time, so plain `pip install` never needs a Rust toolchain
artifacts = ["fastatp/browser/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["fastatp"]

[tool.hatch.build.targets.sdist]
# the tutorials (Docker lab, demo engine, conductor page) are the repo's, not
# the package's: they run against the tree, never ship in a source archive.
# The brand folder (logo files and their generator) is the repo's too, and so
# is the website's builder.
exclude = ["tutorials/", "brand/", "website/"]

[tool.uv]
# uv.lock's bytes depend on the uv that writes them. CI pins UV_VERSION in
# .github/workflows/test.yml and release.yml; an older uv here would rewrite
# the whole lock, so it refuses to run instead. Raise this with UV_VERSION.
# A floor, not an exact pin, so Dependabot's newer uv can still update the lock.
required-version = ">=0.13.7"

[tool.ruff]
line-length = 100
target-version = "py311"
# tests/vectors/ is the vendored CC-0 conformance corpus (see its
# PROVENANCE.md) — third-party files, not ours to lint or reformat
extend-exclude = ["tests/vectors/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary is not always clearer
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["reference/", "build/", "examples/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "regex"
ignore_missing_imports = true

# The codegen half of the schema bridge builds models and annotations
# dynamically; static typing of those constructions is not meaningful.
[[tool.mypy.overrides]]
module = "fastatp.lex.schema"
disable_error_code = [
    "arg-type",
    "assignment",
    "call-overload",
    "misc",
    "return-value",
    "union-attr",
    "unused-ignore",
    "valid-type",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:fastatp.*"]

[tool.coverage.run]
source = ["fastatp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff.lint.per-file-ignores]
# tutorial code is read beside its prose: long lines stay copy-pasteable
"tutorials/**" = ["E501"]
# a Lexicon field with a dict or list default is a pydantic default, not a shared one
"tutorials/lab/backstage.py" = ["RUF012"]
