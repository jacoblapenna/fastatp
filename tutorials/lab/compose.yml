# Machines on one LAN. `./lab.sh` drives this; you never need to run docker yourself.
# alice, bob and eve boot by default; a guide that names its cast boots exactly that cast.
name: fastatp-lab

x-machine: &machine
  build: {context: ../.., dockerfile: tutorials/lab/Dockerfile, target: machine}   # the repo root: the image installs this tree's fastatp
  image: fastatp-lab
  cap_add: [NET_ADMIN]        # a machine may configure its own WireGuard interface
  sysctls: {net.ipv6.conf.all.disable_ipv6: 0}   # the tunnel's addresses are IPv6; Docker turns it off by default
  init: true

services:
  alice:
    <<: *machine
    hostname: alice.lan
    command: [alice.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.11, aliases: [alice.lan]}, stage: {aliases: [alice.stage]}}
    volumes: ["./state/alice.lan:/srv/alice.lan", "./state/backstage/alice.stage:/srv/backstage"]
  bob:
    <<: *machine
    hostname: bob.lan
    command: [bob.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.12, aliases: [bob.lan]}, stage: {aliases: [bob.stage]}}
    volumes: ["./state/bob.lan:/srv/bob.lan", "./state/backstage/bob.stage:/srv/backstage"]
  eve:
    <<: *machine
    hostname: eve.lan
    command: [eve.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.13, aliases: [eve.lan]}, stage: {aliases: [eve.stage]}}
    volumes: ["./state/eve.lan:/srv/eve.lan", "./state/backstage/eve.stage:/srv/backstage"]

  # Hoot's cast: specialized machines that boot only when a guide names them.
  concierge:
    <<: *machine
    profiles: [hoot]
    hostname: concierge.lan
    command: [concierge.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.17, aliases: [concierge.lan]}, stage: {aliases: [concierge.stage]}}
    volumes: ["./state/concierge.lan:/srv/concierge.lan", "./state/backstage/concierge.stage:/srv/backstage"]
  bank:
    <<: *machine
    profiles: [hoot]
    hostname: bank.lan
    command: [bank.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.14, aliases: [bank.lan]}, stage: {aliases: [bank.stage]}}
    volumes: ["./state/bank.lan:/srv/bank.lan", "./state/backstage/bank.stage:/srv/backstage"]
  hoot:
    <<: *machine
    profiles: [hoot]
    hostname: hoot.lan
    command: [hoot.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.15, aliases: [hoot.lan]}, stage: {aliases: [hoot.stage]}}
    volumes: ["./state/hoot.lan:/srv/hoot.lan", "./state/backstage/hoot.stage:/srv/backstage"]
  cab-17:
    <<: *machine
    profiles: [hoot]
    hostname: cab-17.lan
    command: [cab-17.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.16, aliases: [cab-17.lan]}, stage: {aliases: [cab-17.stage]}}
    volumes: ["./state/cab-17.lan:/srv/cab-17.lan", "./state/backstage/cab-17.stage:/srv/backstage"]
  jitney:
    <<: *machine
    profiles: [hoot]
    hostname: jitney.lan
    command: [jitney.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.18, aliases: [jitney.lan]}, stage: {aliases: [jitney.stage]}}
    volumes: ["./state/jitney.lan:/srv/jitney.lan", "./state/backstage/jitney.stage:/srv/backstage"]

  # Geese's one machine: the app's host, booted only when a guide names it.
  geese:
    <<: *machine
    profiles: [geese]
    hostname: geese.lan
    command: [geese.lan]
    environment: {CONDUCTOR: "${CONDUCTOR:-}", PEER: "${PEER:-peer.py}"}
    networks: {lan: {ipv4_address: 192.168.77.20, aliases: [geese.lan]}, stage: {aliases: [geese.stage]}}
    volumes: ["./state/geese.lan:/srv/geese.lan", "./state/backstage/geese.stage:/srv/backstage"]

  # Part 4: the conductor. Backstage: not on the LAN; it cues the machines' players over `stage`.
  conductor:
    build: {context: ../.., dockerfile: tutorials/lab/Dockerfile, target: conductor}
    image: fastatp-lab-conductor
    profiles: [conductor]
    hostname: conductor.stage
    init: true
    environment: {SCORE: "${SCORE:-GETTING_STARTED}"}
    networks: {stage: {aliases: [conductor.stage]}}
    volumes: ["./state/backstage/conductor.stage:/srv/backstage"]
    ports: ["127.0.0.1:8080:80"]

  # Optional: a passive tap on the LAN. Not a machine on it; it sees every frame.
  tap:
    <<: *machine
    profiles: [tap]
    network_mode: host
    sysctls: {}               # the host's network is the host's: Docker refuses to set a sysctl on it
    cap_add: [NET_RAW, NET_ADMIN]
    entrypoint: [tcpdump, -i, fastatp-lan, -nn, -U, -Z, root]
    volumes: ["./state:/state"]

networks:
  lan:
    driver: bridge
    driver_opts: {com.docker.network.bridge.name: fastatp-lan}
    ipam: {config: [{subnet: 192.168.77.0/24}]}
  stage: {}                   # backstage: the demo engine's own wire, so the LAN carries only the guide's traffic
