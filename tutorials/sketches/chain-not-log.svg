  <text x="236.0" y="113.0" text-anchor="middle" font-size="7" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text, var(--fb-text, #15181b))">bank: hold ✓</text>
  <path d="M236 100 L236 86" fill="none" stroke="var(--color-verified, var(--fb-verified, #256f1c))" stroke-width="1.5" marker-end="url(#head-verified)" />
  <rect x="176" y="136" width="120" height="20" rx="8" fill="var(--color-surface-raised, var(--fb-surface-raised, #eceef0))" stroke="var(--color-verified, var(--fb-verified, #256f1c))" stroke-width="2" />
  <text x="236.0" y="149.0" text-anchor="middle" font-size="7" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text, var(--fb-text, #15181b))">bank: paid ✓</text>
  <path d="M236 136 L236 122" fill="none" stroke="var(--color-verified, var(--fb-verified, #256f1c))" stroke-width="1.5" marker-end="url(#head-verified)" />
  <text x="236" y="186" text-anchor="middle" font-size="7" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">each signed by its own; any edit breaks a link</text>
</svg>
