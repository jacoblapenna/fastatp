<!-- the same work three ways: MCP calls, A2A tasks with a callback, and signed records in each owner's repo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="MCP: an agent calls a tool on each server, holding the call open with a token; A2A: an agent hands a task to another agent and is called back at a webhook; records: each party writes signed records in its own repo and the others follow them, nothing held open">
