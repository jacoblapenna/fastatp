<!-- the repo is a content-addressed block store: every arrow is a hash, and only the commit is signed -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img" aria-label="a signed commit points at a tree node by hash, which points at a record by hash">
  <!-- theme:start (written by brand/make.py from tokens.css; do not edit) -->
  <style>
    :root { --fb-border: #cdd2d8; --fb-highlight: #ff9a3d; --fb-surface-raised: #eceef0; --fb-terminal-bg: #f0f1f3; --fb-text: #15181b; --fb-text-muted: #58616b; --fb-verified: #256f1c; }
    @media (prefers-color-scheme: dark) { :root { --fb-border: #333a42; --fb-highlight: #ff9a3d; --fb-surface-raised: #20242a; --fb-terminal-bg: #0a0c0e; --fb-text: #eceef0; --fb-text-muted: #939ba5; --fb-verified: #8fd16a; } }
  </style>
  <rect x="0" y="0" width="340" height="210" rx="8" fill="var(--color-terminal-bg, var(--fb-terminal-bg, #f0f1f3))" />
  <!-- theme:end -->
  <text x="14" y="30" font-size="10" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">signing.key signs ▶</text>
  <rect x="162" y="14" width="166" height="40" rx="7" fill="var(--color-surface-raised, var(--fb-surface-raised, #eceef0))" stroke="var(--color-verified, var(--fb-verified, #256f1c))" stroke-width="2" />
  <text x="245" y="30" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text, var(--fb-text, #15181b))">commit · rev · did · sig</text>
  <text x="245" y="46" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">data: hash of the root node</text>
  <path d="M213 54 V72" fill="none" stroke="var(--color-highlight, var(--fb-highlight, #ff9a3d))" stroke-width="2" marker-end="url(#b)" />
  <rect x="162" y="76" width="166" height="40" rx="7" fill="var(--color-surface-raised, var(--fb-surface-raised, #eceef0))" stroke="var(--color-border, var(--fb-border, #cdd2d8))" />
  <text x="245" y="92" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text, var(--fb-text, #15181b))">tree node</text>
  <text x="245" y="108" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">note/3mz…: hash of the record</text>
  <path d="M213 116 V134" fill="none" stroke="var(--color-highlight, var(--fb-highlight, #ff9a3d))" stroke-width="2" marker-end="url(#b)" />
  <rect x="162" y="138" width="166" height="40" rx="7" fill="var(--color-surface-raised, var(--fb-surface-raised, #eceef0))" stroke="var(--color-border, var(--fb-border, #cdd2d8))" />
  <text x="245" y="154" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text, var(--fb-text, #15181b))">record</text>
  <text x="245" y="170" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">{"text": "hello, LAN", …}</text>
  <text x="14" y="96" font-size="10" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">bytes → hash → address</text>
  <text x="14" y="158" font-size="10" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">change one byte and</text>
  <text x="14" y="172" font-size="10" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">all addresses above change</text>
  <text x="170" y="202" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">readable with the file; writable only with the key</text>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" /></marker></defs>
</svg>
