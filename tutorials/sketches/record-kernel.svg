  <text x="83" y="158" text-anchor="middle" font-size="9" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">deleted: a signed commit</text>
  <path d="M156 146 H164" fill="none" stroke="var(--color-text-muted, var(--fb-text-muted, #58616b))" stroke-width="2" marker-end="url(#k)" /><text x="160" y="114" text-anchor="middle" font-size="9" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">then ▶</text>
