  <rect x="12" y="30" width="142" height="52" rx="7" fill="var(--color-surface-raised, var(--fb-surface-raised, #eceef0))" stroke="var(--color-verified, var(--fb-verified, #256f1c))" stroke-width="2" />
  <text x="83" y="48" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text, var(--fb-text, #15181b))">capability record</text>
  <text x="83" y="62" text-anchor="middle" font-size="9" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-verified, var(--fb-verified, #256f1c))">subject: bob's DID</text>
  <text x="83" y="75" text-anchor="middle" font-size="9" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">signed, in the channel</text>
  <path d="M156 56 H164" fill="none" stroke="var(--color-text-muted, var(--fb-text-muted, #58616b))" stroke-width="2" marker-end="url(#k)" /><text x="160" y="24" text-anchor="middle" font-size="9" font-family="system-ui, sans-serif" fill="var(--color-text-muted, var(--fb-text-muted, #58616b))">then ▶</text>
  <rect x="166" y="30" width="142" height="52" rx="7" fill="var(--color-surface-raised, var(--fb-surface-raised, #eceef0))" stroke="var(--color-sealed, var(--fb-sealed, #0b6f66))" stroke-width="2" />
  <text x="237" y="48" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="var(--color-text, var(--fb-text, #15181b))">kernel peer entry</text>
