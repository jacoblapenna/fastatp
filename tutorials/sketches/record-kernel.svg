<!-- the record decides, the kernel enforces: admission writes the record then opens the tunnel; eviction deletes the record then closes it -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="admit: a capability record, then a kernel peer entry; evict: both removed, record first">
