[package]
name = "fastatp-wasm"
version = "0.1.0"
description = "FastATP browser peer bindings: WebCrypto pens, connection zero, record proofs (wasm-bindgen)"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false: no OS entropy, no OS clock — randomness comes
# from crypto.getRandomValues and time from Date.now(), both injected here.
fastatp-core = { path = "../fastatp-core", default-features = false }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "EcKeyGenParams",
    "EcdsaParams",
] }
serde_json = "1"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
data-encoding = "2"
