# The deterministic test suite is the only merge gate. Every job here either
# passes or fails on reproducible checks; nothing advisory lives in this file.
# The tutorials are part of the suite: each guide is played end to end and its
# page looked at, so a tutorial cannot stop working without failing the gate.
# That job is the one place where time can fail a run: a play that makes no
# progress for 90 seconds is called a stall, and it is not retried.
#
# Every input is pinned: actions by commit SHA, the Rust toolchain by
# rust-toolchain.toml, Python dependencies by uv.lock, the wasm build tools by
# scripts/wasm-tools.env, uv and Node by version below. Two deliberate
# exceptions: the plain-pip job resolves fresh to prove what users get, and
# the tutorials job builds the lab's image the way a reader's machine does,
# from the Dockerfile's tagged base images and the distribution's packages
# (fastatp and its dependencies inside it still come from the tree and uv.lock).
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

env:
  # bumped by hand (Dependabot can't update it); keep in step with release.yml
  UV_VERSION: "0.13.7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Install (from uv.lock)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Types
        run: uv run --no-sync mypy fastatp
      - name: Tests
        # the wire-conformance vectors are vendored in tests/vectors/ and never
        # skip; tests that need the browser bundle, WireGuard, goat, the
        # interop extra, or a Rust toolchain skip here and run in the jobs below
        run: >
          uv run --no-sync pytest --cov=fastatp --cov-report=term --cov-fail-under=85
          --junitxml="$RUNNER_TEMP/junit/python-${{ matrix.python }}.xml"
      - name: Upload the test report (read by the all-tests-ran job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-python-${{ matrix.python }}
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 7

  pip-install:
    # uv is a dev accelerator only: the package must install with plain pip.
    # Deliberately NOT pinned: it resolves fresh from PyPI, the way a user's
    # install does. That is safe because the job can change nothing: a
    # read-only token, no secrets, no cache, no artifacts.
    name: plain pip install
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install --upgrade pip
      - run: .venv/bin/pip install -e .
      - run: |
          .venv/bin/python -c "
          import fastatp
          from fastatp import Peer, Lexicon, Repo, PeerServer, build_did_document
          print('fastatp', fastatp.__version__)
          "

  rust:
    # the second, independent implementation of the wire-format core, and
    # the browser peer bindings built from it
    name: rust
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Core builds for wasm32 without OS entropy or clock
        run: cargo build --locked -p fastatp-core --no-default-features --target wasm32-unknown-unknown
      - name: Browser bindings build for wasm32
        run: cargo build --locked -p fastatp-wasm --target wasm32-unknown-unknown

  browser-peer:
    # builds the real WASM bundle and runs the tests that need it: the bundle
    # smoke under node (smoke.mjs), asset mounting, version lockstep, the
    # packaged-wheel smoke, the hosted-peer end-to-end under node, and the
    # Python<->Rust cross-implementation check
    name: browser peer bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - name: Install pinned wasm build tools (hash-checked, see scripts/wasm-tools.env)
        run: |
          scripts/install-wasm-tools.sh "$RUNNER_TEMP/wasm-tools"
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"
      - run: scripts/build-wasm.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # bumped by hand (Dependabot can't update it)
          node-version: "22.23.4"
      - run: node rust/crates/fastatp-wasm/smoke.mjs
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: >
          uv run --no-sync pytest -v
          --junitxml="$RUNNER_TEMP/junit/browser-peer.xml"
          tests/test_browser_assets.py
          tests/test_wheel_smoke.py
          tests/test_hosted_peer_e2e.py
          tests/test_cross_impl.py
      - name: Upload the test report (read by the all-tests-ran job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-browser-peer
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 7

  interop-oracles:
    # independent implementations check FastATP's output; neither knows
    # FastATP exists. Bluesky's goat runs the network's own firehose
    # validation (including MST inversion) against a PeerServer, and the
    # unmodified atproto-sensorthings package flattens an exported repo CAR.
    name: interop oracles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned goat (hash-checked, see scripts/install-goat.sh)
        run: |
          scripts/install-goat.sh "$RUNNER_TEMP/goat"
          echo "$RUNNER_TEMP/goat" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install (from uv.lock, with the interop extra)
        run: uv sync --locked --extra dev --extra interop
      - name: Both oracles are present (a missing one fails here, never skips)
        run: |
          goat --version
          uv run --no-sync python -c "import atproto_sensorthings"
      - run: >
          uv run --no-sync pytest -v
          --junitxml="$RUNNER_TEMP/junit/interop-oracles.xml"
          tests/test_goat_oracle.py
          tests/test_sensorthings_interop.py
      - name: Upload the test report (read by the all-tests-ran job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-interop-oracles
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 7

  wireguard-netns:
    # the enforcement proof: a capability grant/revoke gates a live WireGuard
    # tunnel. Runs twice: rootless in a user+network namespace (no privileged
    # container needed), then as root, the way an operator's host runs it.
    # The job name stays "(rootless netns)" because the main-branch ruleset
    # requires it by that name.
    name: wireguard enforcement (rootless netns)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WireGuard userspace tools
        # from Ubuntu's signed archive; versions follow the runner image.
        # The index fetch has failed on a mirror DNS hiccup before (PR #23),
        # which skipped every later step and left the real-tunnel tests unrun
        # for the "all tests ran" guard to refuse. A transient failure is
        # retried with growing waits (10, 20, 40, 80 s); one that persists
        # still fails the job, loudly, naming the mirror.
        shell: bash
        run: |
          delay=10
          attempts=5
          log="$RUNNER_TEMP/apt-wireguard.log"
          for attempt in $(seq 1 "$attempts"); do
            echo "::group::apt attempt $attempt of $attempts"
            if sudo apt-get -o Acquire::Retries=3 update 2>&1 | tee "$log" \
               && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                    wireguard-tools iproute2 2>&1 | tee -a "$log"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$attempts" ]; then
              echo "apt attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          mirrors=$(grep -hs '^URIs:' /etc/apt/sources.list.d/ubuntu.sources | sed 's/^URIs: *//' | sort -u | paste -sd ' ')
          echo "last apt output:"
          tail -n 20 "$log"
          echo "::error title=WireGuard tools install failed::apt-get failed $attempts times against ${mirrors:-the configured mirror}; not a flake, or the mirror is down"
          exit 1
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict them via AppArmor by default; the test
        # itself stays rootless, this only lifts the namespace restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Confirm rootless WireGuard netns works on this runner
        run: |
          unshare --user --net --map-root-user bash -c \
            'ip link add wgci type wireguard && wg show wgci && ip link del wgci'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: >
          uv run --no-sync pytest -v -s
          --junitxml="$RUNNER_TEMP/junit/wireguard-rootless.xml"
          tests/test_wireguard_rootless_netns.py
      - name: Root WireGuard enforcement (root netns, real Noise handshake)
        # passwordless sudo on the runner; the test skips without root, so the
        # check above it (sudo -n) makes a missing privilege fail, not skip.
        # -p no:cacheprovider keeps root from writing into the checkout.
        run: |
          sudo -n true
          sudo -n env "PATH=$PATH" .venv/bin/python -m pytest -p no:cacheprovider -v -rs \
            --junitxml="$RUNNER_TEMP/junit/wireguard-root.xml" \
            tests/test_wireguard_netns.py
      - name: Upload the test report (read by the all-tests-ran job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-wireguard
          path: ${{ runner.temp }}/junit/
          if-no-files-found: error
          retention-days: 7

  tutorials:
    # A tutorial that stops working when the library changes under it is a
    # broken promise, so every guide ships with its own proof: this job plays
    # it end to end with nobody watching, on fresh machines, against the
    # fastatp in this checkout. It builds the lab's image from the tree
    # (reusing the layers an earlier run built, where nothing in them
    # changed), boots three peers and the demo engine in Docker, and runs every
    # command the guide runs, in order, over a real WireGuard tunnel. It
    # fails if the lab does not build or boot, if the play stalls, if a
    # command ends the wrong way (one meant to work fails, or one meant to be
    # refused goes through), or if a command does not print what the guide's
    # listing shows. Then it opens the conductor's page in a headless
    # Chrome and looks back through every step of the show it just played.
    #
    # One entry per guide: a new tutorial adds its file's name here (and its
    # score to tutorials/lab/Dockerfile), in the pull request that adds it.
    name: tutorial ${{ matrix.guide }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        guide: [GETTING_STARTED]
    env:
      GUIDE: ${{ matrix.guide }}
      # every build in this job, the play's own `up --build` included, goes to
      # the builder made below, which holds the layers once they are built
      BUILDX_BUILDER: lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load WireGuard on the runner
        # the machines are containers and share the runner's kernel; loading
        # the module here means a missing one fails now, by name, and not
        # later as a peer that never boots
        run: sudo modprobe wireguard
      - name: Bring back the lab image's layers from an earlier run
        # Built from nothing, the image is about three of this job's minutes
        # and a fresh download of everything it installs. The layers are kept
        # under a key made of the files that decide the slow ones (the system
        # packages, fastatp's dependencies, the page's packages). A layer is
        # only ever reused when all that went into it is byte for byte the
        # same, so the fastatp, guide and lab scripts in this checkout are
        # always the ones built in: see tutorials/lab/compose.ci.yml. A pull
        # request from a fork can read these layers and cannot replace them.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lab-layers
          key: lab-layers-${{ runner.os }}-${{ hashFiles('tutorials/lab/Dockerfile', 'pyproject.toml', 'uv.lock', 'tutorials/conductor/package-lock.json') }}
          restore-keys: lab-layers-${{ runner.os }}-
      - name: Build the lab's image
        # its log says CACHED beside every step that was reused
        env:
          COMPOSE_FILE: compose.yml:compose.ci.yml
          LAB_CACHE: ${{ runner.temp }}/lab-layers
        run: |
          # Docker's built-in builder cannot write its layers to a folder; this kind can
          docker buildx create --name "$BUILDX_BUILDER" --driver docker-container
          cd tutorials/lab
          docker compose --profile conductor --progress plain build
          # the build wrote the layers it used beside the old folder: keep only those
          rm -rf "$LAB_CACHE"
          mv "$LAB_CACHE-new" "$LAB_CACHE"
      - name: Play the guide headless
        run: tutorials/lab/lab.sh test "$GUIDE"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install (from uv.lock)
        # for the page check below, which talks to Chrome over a websocket
        run: uv sync --locked
      - name: Look at the page the show was played on
        # the runner image ships Chrome; the check says so by name if it is gone
        run: uv run --no-sync python tutorials/tools/page_check.py http://localhost:8080
      - name: Collect what the machines and the demo engine logged
        if: ${{ failure() }}
        run: |
          mkdir -p "$RUNNER_TEMP/lab"
          cd tutorials/lab
          docker compose --profile conductor ps -a > "$RUNNER_TEMP/lab/containers.txt" 2>&1 || true
          for name in alice bob eve conductor; do
            docker compose --profile conductor logs --no-color "$name" \
              > "$RUNNER_TEMP/lab/$name.log" 2>&1 || true
          done
      - name: Upload the lab's logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-${{ matrix.guide }}
          path: ${{ runner.temp }}/lab/
          retention-days: 7
      - name: Stop the lab
        if: ${{ always() }}
        run: tutorials/lab/lab.sh down

  all-tests-ran:
    # Every job above skips some tests on purpose and another job runs them.
    # This merges every job's JUnit report and fails if any Python test never
    # passed anywhere (skipped or failed in every job), so a test can't
    # quietly stop running. See scripts/check_all_tests_ran.py. Rust tests
    # are not in scope: the rust job runs the whole cargo workspace.
    name: all tests ran
    # `tutorials` is here for the last step only (it writes no JUnit report):
    # a guide that does not play fails this job, which is the one the
    # main-branch ruleset requires.
    needs: [python, browser-peer, interop-oracles, wireguard-netns, tutorials]
    # run even when a test job failed, so the report names what never ran
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          merge-multiple: true
          path: ${{ runner.temp }}/junit/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Every Python test passed in at least one job
        run: uv run --no-project python scripts/check_all_tests_ran.py "$RUNNER_TEMP/junit" tests
      - name: Every test job succeeded
        # after the coverage check, so a failed run still reports what never ran
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "test job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
