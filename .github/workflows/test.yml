# The deterministic test suite is the only merge gate. Every job here either
# passes or fails on reproducible checks; nothing advisory lives in this file.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Types
        run: uv run --no-sync mypy fastatp
      - name: Tests
        # the wire-conformance vectors are vendored in tests/vectors/ and never
        # skip; tests that need the browser bundle, WireGuard, Go, or a Rust
        # toolchain skip here and run in the jobs below
        run: uv run --no-sync pytest --cov=fastatp --cov-report=term --cov-fail-under=85

  pip-install:
    # uv is a dev accelerator only: the package must install with plain pip
    name: plain pip install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install --upgrade pip
      - run: .venv/bin/pip install -e .
      - run: |
          .venv/bin/python -c "
          import fastatp
          from fastatp import Peer, Lexicon, Repo, PeerServer, build_did_document
          print('fastatp', fastatp.__version__)
          "

  rust:
    # the second, independent implementation of the wire-format core, and
    # the browser peer bindings built from it
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Core builds for wasm32 without OS entropy or clock
        run: cargo build -p fastatp-core --no-default-features --target wasm32-unknown-unknown
      - name: Browser bindings build for wasm32
        run: cargo build -p fastatp-wasm --target wasm32-unknown-unknown

  browser-peer:
    # builds the real WASM bundle and runs the tests that need it: asset
    # mounting, version lockstep, the packaged-wheel smoke, the hosted-peer
    # end-to-end under node, and the Python<->Rust cross-implementation check
    name: browser peer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-pack
      - run: scripts/build-wasm.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: >
          uv run --no-sync pytest -v
          tests/test_browser_assets.py
          tests/test_wheel_smoke.py
          tests/test_hosted_peer_e2e.py
          tests/test_cross_impl.py

  wireguard-netns:
    # the enforcement proof: a capability grant/revoke gates a live WireGuard
    # tunnel. Runs rootless in a user+network namespace on the stock ubuntu
    # kernel, so no privileged container is needed.
    name: wireguard enforcement (rootless netns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WireGuard userspace tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wireguard-tools iproute2
      - name: Confirm rootless WireGuard netns works on this runner
        run: |
          unshare --user --net --map-root-user bash -c \
            'ip link add wgci type wireguard && wg show wgci && ip link del wgci'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest tests/test_wireguard_rootless_netns.py -v -s
