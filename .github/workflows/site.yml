# Builds fastatp.com from the repo's own markdown (website/build.py) and
# publishes it to GitHub Pages on every merge to main. Whether the pages
# build is checked before that: tests/test_website.py builds them in the test
# workflow, so a broken link fails the pull request, not this deploy. The
# explainers (website/explainers, a Svelte page) need Node, so they are built
# and tested here, on pull requests too; only a push to main deploys.
#
# Pinned like test.yml: actions by commit SHA, dependencies by uv.lock and
# package-lock.json, uv and Node by version below.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  # keep in step with test.yml and release.yml
  UV_VERSION: "0.13.7"

# one deploy at a time, and a running one finishes
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the sitemap dates each page from its last commit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # bumped by hand (Dependabot can't update it); keep in step with test.yml
          node-version: "22.23.4"
      - name: Build and test the explainers (from package-lock.json)
        working-directory: website/explainers
        run: |
          npm ci
          npm test
          npm run build
      - name: Install (from uv.lock)
        run: uv sync --locked --extra dev
      - name: Build the site
        run: >
          uv run --no-sync python website/build.py
          --require-explainers --out "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
