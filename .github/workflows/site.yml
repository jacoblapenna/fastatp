# Builds fastatp.com from the repo's own markdown (website/build.py) and
# publishes it to GitHub Pages on every merge to main. Whether the site
# builds is checked before that: tests/test_website.py builds it in the test
# workflow, so a broken link fails the pull request, not this deploy.
#
# Pinned like test.yml: actions by commit SHA, dependencies by uv.lock, uv by
# version below.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  # keep in step with test.yml and release.yml
  UV_VERSION: "0.13.7"

# one deploy at a time, and a running one finishes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the sitemap dates each page from its last commit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install (from uv.lock)
        run: uv sync --locked --extra dev
      - name: Build the site
        run: uv run --no-sync python website/build.py --out "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
