# Build and publish a release from a version tag.
#
#   v0.2.0rc1  -> TestPyPI (environment: testpypi), built as 0.2.0rc1
#   v0.2.0     -> PyPI     (environment: pypi)
#
# Both tags go on the same release commit, whose pyproject.toml says 0.2.0;
# see scripts/release_tag_version.py and CONTRIBUTING.md.
#
# Publishing uses PyPI trusted publishing (OpenID Connect): the publish job
# proves its identity with a short-lived token minted for this workflow run.
# There are no API tokens and no shared secrets anywhere in this pipeline.
# Both environments require a maintainer's approval before the publish job
# starts, and PEP 740 attestations are generated automatically.
name: release

on:
  push:
    tags: ["v*"]

permissions: read-all

env:
  # bumped by hand (Dependabot can't update it); keep in step with test.yml
  UV_VERSION: "0.13.7"

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match the package version (an rc tag builds as its rc)
        # vX.Y.Z publishes X.Y.Z; vX.Y.ZrcN builds the same commit as X.Y.ZrcN
        # for TestPyPI (stamped into pyproject.toml and uv.lock, this build
        # only); anything else, including a dev version, is refused
        run: python3 scripts/release_tag_version.py "$GITHUB_REF_NAME"

      # the browser peer bundle is built first so it ships inside both
      # artifacts; installing the package never needs a Rust toolchain
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && rustc --version
      - name: Install pinned wasm build tools (hash-checked, see scripts/wasm-tools.env)
        run: |
          scripts/install-wasm-tools.sh "$RUNNER_TEMP/wasm-tools"
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"
      - run: scripts/build-wasm.sh

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          # the published build never starts from a cache another run wrote
          enable-cache: false
      - run: uv sync --locked --extra dev

      - name: Full suite with the bundle present
        run: uv run --no-sync pytest

      - name: Build
        # the build backend (hatchling) comes from uv.lock, not a fresh
        # isolated download from PyPI
        run: rm -rf dist && uv build --no-build-isolation

      - name: twine check
        run: uv run --no-sync twine check --strict dist/*

      - name: Verify artifact contents
        run: |
          python3 - <<'PY'
          import glob, re, tarfile, zipfile, pathlib
          version = re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          bundled = pathlib.Path("fastatp/browser/static/VERSION").read_text().strip()
          assert bundled == version, f"bundle version {bundled} != package {version}"

          whl = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.endswith("browser/static/fastatp_wasm_bg.wasm") for n in whl), "wheel: bundle missing"
          assert any(n.endswith("fastatp/py.typed") for n in whl), "wheel: py.typed missing"
          leak = [n for n in whl if n.startswith(("rust/", "tests/", "docs/"))]
          assert not leak, f"wheel leak: {leak}"

          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          assert any(n.endswith("browser/static/fastatp_wasm_bg.wasm") for n in sdist), "sdist: bundle missing"
          assert not any("signing.key" in n or "/state/" in n for n in sdist), "sdist: key material present"
          print("artifacts OK:", version)
          PY

      - name: Clean-venv install smoke
        run: |
          # runtime dependencies from uv.lock, every file hash-checked; this
          # step imports them in the job that holds the dist before upload
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o /tmp/runtime.txt
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python --require-hashes -r /tmp/runtime.txt
          uv pip install --python /tmp/smoke/bin/python --no-deps dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          from importlib import metadata
          from fastatp.browser import browser_peer_assets, bundled_version
          assert bundled_version() == metadata.version("fastatp")
          browser_peer_assets()
          print("install smoke OK", metadata.version("fastatp"))
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    if: contains(github.ref_name, 'rc')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fastatp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/fastatp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    # one tag drives both outputs: the package on (Test)PyPI and the GitHub
    # release with the changelog section as notes and the artifacts attached
    name: GitHub release
    needs: [testpypi, pypi]
    if: ${{ !cancelled() && (needs.pypi.result == 'success' || needs.testpypi.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then
            echo "Release candidate $v. See CHANGELOG.md on main for the upcoming release notes." > notes.md
          fi
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *rc*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
