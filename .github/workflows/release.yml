# Build and publish a release from a version tag.
#
#   v0.1.0rc1  -> TestPyPI (environment: testpypi)
#   v0.1.0     -> PyPI     (environment: pypi)
#
# Publishing uses PyPI trusted publishing (OpenID Connect): the publish job
# proves its identity with a short-lived token minted for this workflow run.
# There are no API tokens and no shared secrets anywhere in this pipeline.
# Both environments require a maintainer's approval before the publish job
# starts, and PEP 740 attestations are generated automatically.
name: release

on:
  push:
    tags: ["v*"]

permissions: read-all

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must equal the package version
        run: |
          v="$(python3 - <<'PY'
          import re, pathlib
          print(re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1))
          PY
          )"
          echo "pyproject version: $v   tag: $GITHUB_REF_NAME"
          test "v$v" = "$GITHUB_REF_NAME"

      # the browser peer bundle is built first so it ships inside both
      # artifacts; installing the package never needs a Rust toolchain
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-pack
      - run: scripts/build-wasm.sh

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"

      - name: Full suite with the bundle present
        run: uv run --no-sync pytest

      - name: Build
        run: rm -rf dist && uv build

      - name: twine check
        run: uv run --no-sync --with twine twine check --strict dist/*

      - name: Verify artifact contents
        run: |
          python3 - <<'PY'
          import glob, re, tarfile, zipfile, pathlib
          version = re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          bundled = pathlib.Path("fastatp/browser/static/VERSION").read_text().strip()
          assert bundled == version, f"bundle version {bundled} != package {version}"

          whl = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.endswith("browser/static/fastatp_wasm_bg.wasm") for n in whl), "wheel: bundle missing"
          assert any(n.endswith("fastatp/py.typed") for n in whl), "wheel: py.typed missing"
          leak = [n for n in whl if n.startswith(("rust/", "tests/", "docs/"))]
          assert not leak, f"wheel leak: {leak}"

          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          assert any(n.endswith("browser/static/fastatp_wasm_bg.wasm") for n in sdist), "sdist: bundle missing"
          assert not any("signing.key" in n or "/state/" in n for n in sdist), "sdist: key material present"
          print("artifacts OK:", version)
          PY

      - name: Clean-venv install smoke
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          from importlib import metadata
          from fastatp.browser import browser_peer_assets, bundled_version
          assert bundled_version() == metadata.version("fastatp")
          browser_peer_assets()
          print("install smoke OK", metadata.version("fastatp"))
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    if: contains(github.ref_name, 'rc')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fastatp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fastatp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    # one tag drives both outputs: the package on (Test)PyPI and the GitHub
    # release with the changelog section as notes and the artifacts attached
    name: GitHub release
    needs: [testpypi, pypi]
    if: ${{ !cancelled() && (needs.pypi.result == 'success' || needs.testpypi.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then
            echo "Release candidate $v. See CHANGELOG.md on main for the upcoming release notes." > notes.md
          fi
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *rc*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
