version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # update uv.lock only; the install floors in pyproject.toml are a
    # compatibility promise to users and change by hand, not by bot
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
